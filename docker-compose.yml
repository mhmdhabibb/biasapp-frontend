version: "3.8"

services:
  frontend:
    build:
      context: ./biasappfe # <-- Ubah ke ./biasappfe
      dockerfile: Dockerfile
    container_name: biasapp_frontend
    restart: always
    env_file:
      - ./biasappfe/.env # <-- Arahkan ke file .env di dalam biasappfe
    ports:
      - "3000:80"
    networks:
      - vps_infra_net

networks:
  vps_infra_net:
    external: true
    name: vps-infra_default
